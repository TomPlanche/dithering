[package]
name = "dithering-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dithering pipeline"

[lib]
name = "dithering_core"
path = "src/lib.rs"

[[bin]]
name = "dithering-core"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["image-io"]

[features]
default = ["cli"]
# Image decoding and palette PNG encoding.
image-io = ["dep:png", "image/jpeg", "image/png"]
# The command line front end.
cli = ["image-io", "dep:clap"]

[dependencies]
# Buffers, resampling and colour indexing. The codecs come with `image-io`.
image = { version = "0.25", default-features = false }
# Row-level parallelism in the hot stages, and the CLI's batch loop.
rayon = "1.11"
# Palette PNG output, which `image` cannot write.
png = { version = "0.18", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
