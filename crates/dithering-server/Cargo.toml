[package]
name = "dithering-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP backend exposing the core dithering pipeline"

[lib]
name = "dithering_server"
path = "src/lib.rs"

[[bin]]
name = "dithering-server"
path = "src/main.rs"

[dependencies]
# The pipeline itself. No CLI, but the byte-level image codecs.
dithering-core = { workspace = true, features = ["image-io"] }

axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
# Drives the router in-process, so the API tests need no socket.
tower = { version = "0.5", features = ["util"] }
